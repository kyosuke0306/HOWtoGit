<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HOW to Git — 遊んで学ぶ Git シミュレーター</title>
  <meta name="description" content="Git の使い方を初心者向けにゲーム感覚で学べるシミュレーター。疑似ターミナルでコマンドを打ち、ブランチの構造を視覚的に確認しながら、チーム開発のミッションに挑戦しよう。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233fb950' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='6' cy='5' r='2.5'/%3E%3Ccircle cx='6' cy='19' r='2.5'/%3E%3Ccircle cx='18' cy='9' r='2.5'/%3E%3Cpath d='M6 7.5v9M18 11.5c0 4-6 3-11 5.5'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HOWtoGit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=9258108a">
  <script type="importmap">
  {
    "imports": {
      "./js/app.js": "./js/app.js?v=74a813bb",
      "./js/ask.js": "./js/ask.js?v=49cde69e",
      "./js/builder.js": "./js/builder.js?v=cf773159",
      "./js/diff.js": "./js/diff.js?v=8c59de29",
      "./js/docs.js": "./js/docs.js?v=b1914027",
      "./js/git.js": "./js/git.js?v=015be560",
      "./js/graph.js": "./js/graph.js?v=e6d08f09",
      "./js/help.js": "./js/help.js?v=fe5c5834",
      "./js/icons.js": "./js/icons.js?v=18cc4bc3",
      "./js/keyboard.js": "./js/keyboard.js?v=f5a6d4e9",
      "./js/missions.js": "./js/missions.js?v=54247547",
      "./js/scenario.js": "./js/scenario.js?v=c473d604",
      "./js/shape.js": "./js/shape.js?v=ab097c71",
      "./js/shell.js": "./js/shell.js?v=6b372b36",
      "./js/stages.js": "./js/stages.js?v=a946c3bf"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="btn icon btn-home" aria-label="トップへ"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="brand"><span class="logo"><svg class="i" aria-hidden="true"><use href="#i-logo"/></svg></span><span class="brand-text">HOW<em>to</em>Git</span></div>
    <span id="screen-title" class="screen-title"></span>
    <button id="btn-docs" class="btn icon" title="コマンド辞典" aria-label="コマンド辞典"><svg class="i" aria-hidden="true"><use href="#i-book-open"/></svg></button>
    <button id="btn-theme" class="btn icon" title="テーマ切替" aria-label="テーマ切替"><svg class="i" aria-hidden="true"><use href="#i-contrast"/></svg></button>
    <button id="btn-settings" class="btn icon btn-settings" title="設定" aria-label="設定"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </header>

  <section class="screen-home" id="home"></section>
  <section class="screen-lessons" id="lessons"></section>

  <main class="play" id="play">
    <section class="stage-area">
      <div id="graph" class="graph main-graph"></div>

      <div class="float-top">
        <div class="mini-bar">
          <button type="button" id="btn-back" class="mini" aria-label="戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></button>
          <button type="button" id="req-chip" class="req-chip" aria-label="依頼を開く"></button>
          <button type="button" id="btn-zoom" class="mini hidden" aria-label="元の大きさに戻す"><svg class="i" aria-hidden="true"><use href="#i-zoom-reset"/></svg></button>
          <button type="button" id="btn-ask" class="mini ask-btn" aria-label="質問する"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg></button>
          <button type="button" id="btn-help" class="mini help-mini hidden" aria-label="HELP: 元に戻す手順">HELP</button>
          <button type="button" id="btn-goal" class="mini goal-btn hidden" aria-label="ゴールを見る"><svg class="i" aria-hidden="true"><use href="#i-flag"/></svg></button>
        </div>
        <div id="opbanner"></div>
      </div>

      <div class="goal-mini hidden" id="goal-box">
        <button type="button" class="goal-head" id="goal-toggle"><svg class="i" aria-hidden="true"><use href="#i-flag"/></svg><b>ゴール</b><svg class="i" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        <div id="goal" class="graph"></div>
      </div>

      <button type="button" class="bubble hidden" id="bubble"></button>

      <div class="fab-bar">
        <div class="tabs view-tabs">
          <button data-g="local" class="active" aria-label="手元"><svg class="i" aria-hidden="true"><use href="#i-monitor"/></svg></button>
          <button data-g="remote" aria-label="GitHub"><svg class="i" aria-hidden="true"><use href="#i-cloud"/></svg></button>
        </div>
        <button id="btn-code" class="fab code-fab hidden" aria-label="コードを書く"><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg><span>コード</span></button>
        <button id="btn-files" class="fab" aria-label="ファイル"><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg></button>
        <button id="btn-log" class="fab" aria-label="ログ"><svg class="i" aria-hidden="true"><use href="#i-terminal"/></svg></button>
        <button id="btn-cmd" class="fab primary" aria-label="コマンド"><svg class="i" aria-hidden="true"><use href="#i-keyboard"/></svg></button>
      </div>

      <section class="sheet req-sheet" id="req-sheet" aria-label="依頼">
        <button type="button" class="sheet-close" data-close="req-sheet" aria-label="閉じる"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
        <div id="req"></div>
      </section>

      <section class="sheet ask-sheet" id="ask-sheet" aria-label="質問">
        <div class="sheet-bar"><b><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>質問 <small>Gemini</small></b><button type="button" class="sheet-close" data-close="ask-sheet" aria-label="閉じる"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
        <div class="ask-nokey hidden" id="ask-nokey"><p>API キーが未設定です。トップ画面右上の歯車から設定してください。</p><button type="button" class="btn small" id="ask-go-home">トップへ</button></div>
        <div class="ask-msgs" id="ask-msgs"></div>
        <form class="ask-form" id="ask-form">
          <textarea id="ask-input" rows="1" placeholder="Git について質問" enterkeyhint="send"></textarea>
          <button type="submit" class="enter-btn" aria-label="送信"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></button>
        </form>
      </section>

      <section class="sheet log-sheet" id="log-sheet" aria-label="ログ">
        <div class="sheet-bar"><b><svg class="i" aria-hidden="true"><use href="#i-terminal"/></svg>ログ</b><button type="button" class="sheet-close" data-close="log-sheet" aria-label="閉じる"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
        <div class="log" id="term-out" aria-live="polite"></div>
      </section>
    </section>

    <section class="console" id="terminal">
      <div class="cmdline">
        <button id="btn-cmd-close" class="icon-btn" aria-label="閉じる"><svg class="i" aria-hidden="true"><use href="#i-chevron-down"/></svg></button>
        <span class="prompt" id="prompt"></span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="コマンド入力" placeholder="下で組み立てる">
        <button id="btn-clear" class="icon-btn" aria-label="消す"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
        <button id="btn-pad" class="icon-btn" aria-label="キーボードに切替"><svg class="i" aria-hidden="true"><use href="#i-keyboard"/></svg></button>
        <button id="btn-enter" class="enter-btn" aria-label="実行"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></button>
      </div>
      <div class="cmd-desc" id="cmd-desc"></div>
      <div class="builder" id="builder"></div>
      <div id="kb" class="kb" aria-label="キーボード"></div>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="btn icon" aria-label="閉じる"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="modal editor" id="editor" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head"><h2><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg> <span id="editor-file"></span></h2></div>
      <div id="conflict-tools" class="conflict-tools">
        <span><svg class="i" aria-hidden="true"><use href="#i-alert"/></svg> 競合:</span>
        <button class="btn small" data-resolve="ours">自分を採用</button>
        <button class="btn small" data-resolve="theirs">相手を採用</button>
        <button class="btn small" data-resolve="both">両方残す</button>
      </div>
      <textarea id="editor-text" spellcheck="false"></textarea>
      <div class="editor-actions">
        
        <button id="editor-cancel" class="btn ghost">キャンセル</button>
        <button id="editor-save" class="btn primary"><svg class="i" aria-hidden="true"><use href="#i-save"/></svg> 保存</button>
      </div>
    </div>
  </div>

  <div class="gdialog" id="gdialog" role="alertdialog" aria-modal="true" aria-labelledby="gdialog-title">
    <div class="gdialog-box">
      <div class="gdialog-icon" id="gdialog-icon"></div>
      <h3 id="gdialog-title"></h3>
      <p id="gdialog-text"></p>
      <div class="gdialog-cost" id="gdialog-cost"></div>
      <div class="gdialog-btns"><button type="button" class="gbtn" id="gdialog-no"></button><button type="button" class="gbtn primary" id="gdialog-yes"></button></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="confetti" class="confetti"></div>

  <script type="module" src="js/app.js?v=74a813bb"></script>
</body>
</html>
