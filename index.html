<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOW to Git — 遊んで学ぶ Git シミュレーター</title>
  <meta name="description" content="Git の使い方を初心者向けにゲーム感覚で学べるシミュレーター。疑似ターミナルでコマンドを打ち、ブランチの構造を視覚的に確認しながら、チーム開発のミッションに挑戦しよう。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233fb950' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='6' cy='5' r='2.5'/%3E%3Ccircle cx='6' cy='19' r='2.5'/%3E%3Ccircle cx='18' cy='9' r='2.5'/%3E%3Cpath d='M6 7.5v9M18 11.5c0 4-6 3-11 5.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="btn icon btn-home" aria-label="トップへ"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="brand"><span class="logo"><svg class="i" aria-hidden="true"><use href="#i-logo"/></svg></span><span class="brand-text">HOW<em>to</em>Git</span></div>
    <span id="screen-title" class="screen-title"></span>
    <div class="level" title="経験値 (XP)">
      <span class="lv">Lv<b id="lv">1</b></span>
      <div class="xpbar"><i id="xpfill"></i></div>
    </div>
    <button id="btn-docs" class="btn icon" title="コマンド辞典" aria-label="コマンド辞典"><svg class="i" aria-hidden="true"><use href="#i-book-open"/></svg></button>
    <button id="btn-theme" class="btn icon" title="テーマ切替" aria-label="テーマ切替"><svg class="i" aria-hidden="true"><use href="#i-contrast"/></svg></button>
  </header>

  <section class="screen-home" id="home"></section>
  <section class="screen-lessons" id="lessons"></section>

  <main class="layout">
    <section class="view view-play active" data-view="play">
      <div class="mission" id="mission"></div>
      <div class="terminal" id="terminal">
        <div class="term-out" id="term-out" aria-live="polite"></div>
        <div class="quick" id="quick">
          <button data-run="git status">status</button>
          <button data-insert="git add .">add .</button>
          <button data-insert='git commit -m ""' data-caret="-1">commit</button>
          <button data-run="git log --oneline --all">log</button>
          <button data-insert="git switch ">switch</button>
          <button data-insert="git push">push</button>
          <button data-insert="git pull">pull</button>
          <button data-insert="edit ">edit</button>
          <button data-run="ls">ls</button>
        </div>
        <div class="term-input">
          <span class="prompt" id="prompt"></span>
          <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="コマンド入力" placeholder="コマンドを入力">
          <button id="btn-enter" class="enter-btn" aria-label="実行"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></button>
        </div>
      </div>
    </section>

    <section class="view view-graph" data-view="graph">
      <div class="card graph-card">
        <div class="card-head">
          <div class="tabs">
            <button data-g="local" class="active"><svg class="i" aria-hidden="true"><use href="#i-monitor"/></svg>ローカル</button>
            <button data-g="remote"><svg class="i" aria-hidden="true"><use href="#i-cloud"/></svg>GitHub</button>
          </div>
          <small id="remote-name" class="muted"></small>
        </div>
        <div id="graph" class="graph"></div>
      </div>
    </section>

    <section class="view view-files" data-view="files">
      <div class="card areas">
        <div class="card-head"><h3><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg><span id="cwd-label">~</span></h3><span id="stashinfo" class="stashinfo"></span></div>
        <div id="opbanner"></div>
        <div class="area-cols">
          <div class="area" id="area-work"><h4>作業中</h4><div class="files"></div></div>
          <div class="area-arrow">add</div>
          <div class="area" id="area-stage"><h4>ステージ</h4><div class="files"></div></div>
          <div class="area-arrow">commit</div>
          <div class="area" id="area-repo"><h4>コミット済</h4><div class="files"></div></div>
        </div>
      </div>
    </section>

    <section class="view view-chat" data-view="chat">
      <div class="card chat-card" id="chat-card">
        <div class="card-head"><h3><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>チーム</h3></div>
        <div id="chat" class="chat"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="表示切替">
    <button data-view="play" class="active"><svg class="i" aria-hidden="true"><use href="#i-terminal"/></svg><span>操作</span></button>
    <button data-view="graph"><svg class="i" aria-hidden="true"><use href="#i-branch"/></svg><span>グラフ</span></button>
    <button data-view="files"><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg><span>ファイル</span></button>
    <button data-view="chat"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg><span>チャット</span></button>
  </nav>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="btn icon" aria-label="閉じる"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="modal editor" id="editor" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head"><h2><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg> <span id="editor-file"></span></h2></div>
      <div id="conflict-tools" class="conflict-tools">
        <span><svg class="i" aria-hidden="true"><use href="#i-alert"/></svg> 競合:</span>
        <button class="btn small" data-resolve="ours">自分を採用</button>
        <button class="btn small" data-resolve="theirs">相手を採用</button>
        <button class="btn small" data-resolve="both">両方残す</button>
      </div>
      <textarea id="editor-text" spellcheck="false"></textarea>
      <div class="editor-actions">
        
        <button id="editor-cancel" class="btn ghost">キャンセル</button>
        <button id="editor-save" class="btn primary"><svg class="i" aria-hidden="true"><use href="#i-save"/></svg> 保存</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="confetti" class="confetti"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
